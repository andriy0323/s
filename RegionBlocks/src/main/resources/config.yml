# ════════════════════════════════════════════════════════════════════
# RegionBlocks — конфигурация магазина
# ════════════════════════════════════════════════════════════════════
# Цены в Aris-coins (валюта RegionBlocks, /aris). Если запись отсутствует,
# предмет в магазине просто не появится. После правки выполни:
#   /a reload          — перезагрузить config.yml магазина
# (либо перезапусти сервер).

shop:
  # ─────────────────────────────────────────────────────────────────
  # Сферы — обычные сферы из ArisDonate (надеваются в шлем/off-hand).
  # ID должен совпадать с id в config.yml ArisDonate (раздел spheres:).
  # ─────────────────────────────────────────────────────────────────
  spheres:
    bounce:   200
    ember:    250
    owl:      180
    tide:     350
    force:    500
    bulwark:  600
    gale:     450
    vitality: 700

  # ─────────────────────────────────────────────────────────────────
  # Шары — премиум-сферы. Изначально выпадали только из китов,
  # теперь их можно купить отдельно за Aris-coins.
  # ─────────────────────────────────────────────────────────────────
  balls:
    nebula:   2000
    cosmos:   2500
    phoenix:  3500
    phantom:  6000
    chaos:    9000

  # ─────────────────────────────────────────────────────────────────
  # Киты — все донат-киты из ArisDonate. Покупка выдаёт ВЕСЬ кит
  # без записи кулдауна (это разовая покупка из магазина, не /kit).
  # По просьбе пользователя цены выставлены очень высокими.
  # ─────────────────────────────────────────────────────────────────
  kits:
    spark:      5000
    luna:       8000
    stellar:   12000
    nova:      18000
    comet:     25000
    galaxy:    35000
    nebula:    50000
    cosmos:    70000
    phoenix:   90000
    aris:     120000
    arisplus: 150000

# ════════════════════════════════════════════════════════════════════
# Текстуры голов (player heads) для иконок магазина.
# ════════════════════════════════════════════════════════════════════
# Каждое значение — это либо:
#   1) 64-символьный hex-хеш текстуры (со страницы minecraft-heads.com
#      → раздел «Texture URL» — берёшь часть после .../texture/), либо
#   2) полная Mojang-base64 строка (со страницы minecraft-heads.com
#      → раздел «For developers» → «Value»).
#
# Пустая строка → используется обычная PLAYER_HEAD без текстуры
# (или fallback-материал из RU-названия). Кривая текстура не упадёт —
# просто будет голова-Стив.
#
# ID совпадают с ID товаров. Чтобы быстро найти хороший вариант, иди
# на https://minecraft-heads.com/custom-heads, копируй "Texture URL"
# и вставляй сюда. После правки — /a reload.
heads:
  # Приваты
  privates:
    common:    ""
    rare:      ""
    epic:      ""
    mythic:    ""
    legendary: ""
    aris:      ""
  # ТНТ
  tnt:
    basic:  ""
    strong: ""
    mega:   ""
    titan:  ""
  # Вагонетки
  minecart:
    basic:  ""
    strong: ""
    mega:   ""
    titan:  ""
  # Сферы
  spheres:
    bounce:   ""
    ember:    ""
    owl:      ""
    tide:     ""
    force:    ""
    bulwark:  ""
    gale:     ""
    vitality: ""
  # Шары
  balls:
    nebula:  ""
    cosmos:  ""
    phoenix: ""
    phantom: ""
    chaos:   ""
  # Киты
  kits:
    spark:    ""
    luna:     ""
    stellar:  ""
    nova:     ""
    comet:    ""
    galaxy:   ""
    nebula:   ""
    cosmos:   ""
    phoenix:  ""
    aris:     ""
    arisplus: ""
  # Декор: навигация / инфо / баланс
  nav:
    privates:  ""
    tnt:       ""
    minecart:  ""
    spheres:   ""
    balls:     ""
    kits:      ""
  info:
    privates:  ""
    tnt:       ""
    minecart:  ""
    spheres:   ""
    balls:     ""
    kits:      ""
  balance:     ""
  ariscoin:    ""
