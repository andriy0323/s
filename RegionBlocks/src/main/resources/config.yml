# ════════════════════════════════════════════════════════════════════
# RegionBlocks — конфигурация магазина
# ════════════════════════════════════════════════════════════════════
# Цены в Aris-coins (валюта RegionBlocks, /aris). Если запись отсутствует,
# предмет в магазине просто не появится. После правки выполни:
#   /a reload          — перезагрузить config.yml магазина
# (либо перезапусти сервер).

shop:
  # ─────────────────────────────────────────────────────────────────
  # Сферы — обычные сферы из ArisDonate (надеваются в шлем/off-hand).
  # ID должен совпадать с id в config.yml ArisDonate (раздел spheres:).
  # ─────────────────────────────────────────────────────────────────
  spheres:
    bounce:   200
    ember:    250
    owl:      180
    tide:     350
    force:    500
    bulwark:  600
    gale:     450
    vitality: 700

  # ─────────────────────────────────────────────────────────────────
  # Шары — премиум-сферы. Изначально выпадали только из китов,
  # теперь их можно купить отдельно за Aris-coins.
  # ─────────────────────────────────────────────────────────────────
  balls:
    nebula:   2000
    cosmos:   2500
    phoenix:  3500
    phantom:  6000
    chaos:    9000

  # ─────────────────────────────────────────────────────────────────
  # Киты — все донат-киты из ArisDonate. Покупка выдаёт ВЕСЬ кит
  # без записи кулдауна (это разовая покупка из магазина, не /kit).
  # По просьбе пользователя цены выставлены очень высокими.
  # ─────────────────────────────────────────────────────────────────
  kits:
    spark:      5000
    luna:       8000
    stellar:   12000
    nova:      18000
    comet:     25000
    galaxy:    35000
    nebula:    50000
    cosmos:    70000
    phoenix:   90000
    aris:     120000
    arisplus: 150000

  # ─────────────────────────────────────────────────────────────────
  # Трапки — цены задаются в plugins/Trapki/config.yml.
  # Здесь править нечего; этот раздел оставлен как памятка.
  #
  # Для активации любой трапки нужен 1 «Обломок незерита» в инвентаре
  # (NETHERITE_SCRAP, продаётся отдельной кнопкой во вкладке «Трапки»).
  # ─────────────────────────────────────────────────────────────────
