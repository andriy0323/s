# ─────────────────────────────────────────────────────────────────────────────
#  Trapki — конфиг цен и параметров.
#  После правки выполни /trap reload (или /trapki reload).
# ─────────────────────────────────────────────────────────────────────────────

prices:
  # Цена обломка незерита (продаётся в /shop, нужен для активации любой трапки).
  scrap: 500

  # Цены трапок в Aris-coins (валюта RegionBlocks/ArisDonate).
  # Эти же значения подхватывает /shop в RegionBlocks.
  traps:
    # ─── малые (3×3, радиус 1) ──────────────────────────────────
    spike:     500
    swamp:     700
    poison:    900
    smoke:    1100
    ember:    1500

    # ─── большие (5×5, радиус 2) ────────────────────────────────
    lightning: 3000
    boom:      4500
    wither:    6000
    magnet:    7500
    chaos:    10000
